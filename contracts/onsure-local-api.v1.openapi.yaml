openapi: 3.1.0
info:
  title: ONSure Local Authenticated API
  version: 1.0.0
  description: Loopback-only, bearer-authenticated, non-final ONSure workflow API.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "47311"
paths:
  /v1/health:
    get:
      operationId: readHealth
      security: []
      responses:
        "200":
          description: Local API health
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NonFinalResponse"}
  /v1/status:
    get:
      operationId: readStatus
      responses:
        "200": {$ref: "#/components/responses/SuccessResponse"}
        "401": {$ref: "#/components/responses/ErrorResponse"}
  /v1/workflow:
    post:
      operationId: runWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation, request]
              properties:
                operation: {type: string, pattern: "^[a-z][a-z0-9.-]{2,80}$"}
                request: {type: object}
      responses:
        "200": {$ref: "#/components/responses/SuccessResponse"}
        "400": {$ref: "#/components/responses/ErrorResponse"}
        "401": {$ref: "#/components/responses/ErrorResponse"}
  /v1/program-profile:
    post:
      operationId: learnProgramCompatibility
      requestBody: {$ref: "#/components/requestBodies/JsonRequest"}
      responses:
        "200": {$ref: "#/components/responses/SuccessResponse"}
        "400": {$ref: "#/components/responses/ErrorResponse"}
        "401": {$ref: "#/components/responses/ErrorResponse"}
  /v1/validate:
    post:
      operationId: runValidationCompatibility
      description: Use validation_mode UNIVERSAL for target-neutral seven-group validation.
      requestBody: {$ref: "#/components/requestBodies/JsonRequest"}
      responses:
        "200": {$ref: "#/components/responses/SuccessResponse"}
        "400": {$ref: "#/components/responses/ErrorResponse"}
        "401": {$ref: "#/components/responses/ErrorResponse"}
  /v1/run-artifact:
    post:
      operationId: readRunArtifact
      requestBody: {$ref: "#/components/requestBodies/JsonRequest"}
      responses:
        "200": {$ref: "#/components/responses/SuccessResponse"}
        "400": {$ref: "#/components/responses/ErrorResponse"}
        "401": {$ref: "#/components/responses/ErrorResponse"}
  /v1/workspace-snapshot:
    post:
      operationId: createWorkspaceSnapshot
      requestBody: {$ref: "#/components/requestBodies/JsonRequest"}
      responses:
        "200": {$ref: "#/components/responses/SuccessResponse"}
        "400": {$ref: "#/components/responses/ErrorResponse"}
        "401": {$ref: "#/components/responses/ErrorResponse"}
  /v1/autopilot-control:
    post:
      operationId: controlAutopilot
      requestBody: {$ref: "#/components/requestBodies/JsonRequest"}
      responses:
        "200": {$ref: "#/components/responses/SuccessResponse"}
        "400": {$ref: "#/components/responses/ErrorResponse"}
        "401": {$ref: "#/components/responses/ErrorResponse"}
components:
  securitySchemes:
    LocalBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-local-token
  requestBodies:
    JsonRequest:
      required: true
      content:
        application/json:
          schema: {type: object}
  responses:
    SuccessResponse:
      description: Non-final successful response
      content:
        application/json:
          schema: {$ref: "#/components/schemas/NonFinalResponse"}
    ErrorResponse:
      description: Fail-closed error response
      content:
        application/json:
          schema:
            allOf:
              - {$ref: "#/components/schemas/NonFinalResponse"}
              - type: object
                required: [error]
                properties:
                  error: {type: string}
  schemas:
    NonFinalResponse:
      type: object
      required: [contract, final_claim_allowed]
      properties:
        contract: {type: string}
        final_claim_allowed: {const: false}
      additionalProperties: true
security:
  - LocalBearer: []
