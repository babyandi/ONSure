name: ONSure Main Post-Merge Revalidation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-postmerge-revalidation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and test root authority build
        run: mvn -B test
      - name: Verify independent discovery saturation inputs
        run: python3 scripts/validate-design-discovery-saturation.py
      - name: Verify human design authority receipts
        run: python3 scripts/validate-human-design-authority-decisions.py
      - name: Verify independent CLEAN A/B receipts
        run: python3 scripts/validate-independent-clean-twice.py
      - name: Materialize exact design inventory
        run: python3 scripts/materialize-design-artifact-inventory.py
      - name: Verify design reconstructability
        run: python3 scripts/verify-design-baseline-reconstructability.py
      - name: Execute full post-delta closure chain on main SHA
        run: bash scripts/run-product-design-closure-post-delta.sh
      - name: Attempt main-only Design Lock issuance
        env:
          GITHUB_REF_NAME: main
        run: python3 scripts/issue-design-lock.py
      - name: Upload main revalidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onsure-main-postmerge-revalidation-${{ github.sha }}
          path: |
            .onsure/**
            receipts/local/**
          retention-days: 90
