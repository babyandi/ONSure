name: ONSure self-validation nonfinal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run all JUnit tests
        run: mvn -B -ntp verify
      - name: Run Python contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Preflight executable assurance contracts
        run: bash scripts/preflight-local-assurance.sh

  repeated-harness:
    runs-on: ubuntu-latest
    needs: unit-and-contract
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run nonfinal development gate
        run: bash scripts/run-onsure-development-gate.sh
      - name: Mark assurance ceiling
        run: |
          {
            echo "## ONSure assurance ceiling"
            echo ""
            echo "- Internal verifier/audit: executed by this workflow"
            echo "- Independent OTester/OAudit: NOT_RUN"
            echo "- Assurance class: SELF_VALIDATION_NONFINAL"
            echo "- FinalLock / Production GO / Commercial GO: prohibited"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: onsure-self-validation-nonfinal
          path: receipts/
          if-no-files-found: error
          retention-days: 30
