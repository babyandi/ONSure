name: ONSure self-validation nonfinal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run all JUnit tests
        run: mvn -B -ntp verify
      - name: Run Python contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Preflight executable assurance contracts
        run: bash scripts/preflight-local-assurance.sh

  repeated-harness:
    runs-on: ubuntu-latest
    needs: unit-and-contract
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run nonfinal development gate
        run: bash scripts/run-onsure-development-gate.sh
      - name: Mark assurance ceiling
        run: |
          {
            echo "## ONSure assurance ceiling"
            echo ""
            echo "- Internal verifier/audit: executed by this workflow"
            echo "- Independent OTester/OAudit: NOT_RUN"
            echo "- Assurance class: SELF_VALIDATION_NONFINAL"
            echo "- FinalLock / Production GO / Commercial GO: prohibited"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: onsure-self-validation-nonfinal
          path: receipts/
          if-no-files-found: error
          retention-days: 30

  onguard-fixed-target:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: onguard
          POSTGRES_USER: onguard
          POSTGRES_PASSWORD: onguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onguard -d onguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ONGUARD_PG_HOST: localhost
      ONGUARD_PG_PORT: "5432"
      ONGUARD_PG_DB: onguard
      ONGUARD_PG_USER: onguard
      ONGUARD_PG_PASSWORD: onguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: babyandi/ONGuard
          ref: 33cf9cadb2052706fb9e9eafc422c7cdbb3c62dd
          path: onguard-target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: onguard-target/pyproject.toml
      - name: Install ONGuard target
        run: python -m pip install -e "./onguard-target[postgres]"
      - name: Run ONGuard core and rule gates
        working-directory: onguard-target
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python tools/validate_rule_traceability.py
          python tools/check_extended_good_code_rules.py
          python tools/run_good_code_campaign.py
          cp artifacts/good-code-campaign-receipt.json /tmp/onguard-receipt-1.json
          python tools/run_good_code_campaign.py
          python tools/verify_good_code_reproducibility.py \
            /tmp/onguard-receipt-1.json artifacts/good-code-campaign-receipt.json
          python tools/verify_good_code_receipt.py artifacts/good-code-campaign-receipt.json
      - name: Apply and attack PostgreSQL append-only schema
        working-directory: onguard-target
        run: |
          python - <<'PY'
          import os
          import psycopg2
          connection = psycopg2.connect(
              host=os.environ["ONGUARD_PG_HOST"],
              port=os.environ["ONGUARD_PG_PORT"],
              dbname=os.environ["ONGUARD_PG_DB"],
              user=os.environ["ONGUARD_PG_USER"],
              password=os.environ["ONGUARD_PG_PASSWORD"],
          )
          with connection:
              with connection.cursor() as cursor:
                  cursor.execute(open("db/onguard_schema.sql", encoding="utf-8").read())
          connection.close()
          PY
          PYTHONPATH=src python -m unittest discover -s tests_postgres -v
      - name: Prove ONGuard sandbox external egress is blocked
        run: |
          docker compose -f onguard-target/.devcontainer/docker-compose.yml \
            up -d --wait sandbox-probe
          if docker compose -f onguard-target/.devcontainer/docker-compose.yml \
            exec -T sandbox-probe \
            python -c 'import socket; socket.create_connection(("1.1.1.1", 53), 3)'; then
            echo "external egress unexpectedly succeeded" >&2
            exit 1
          fi
          docker network inspect onguard-net --format '{{json .Internal}}' | grep -qx true
      - name: Tear down ONGuard sandbox
        if: always()
        run: docker compose -f onguard-target/.devcontainer/docker-compose.yml down -v
