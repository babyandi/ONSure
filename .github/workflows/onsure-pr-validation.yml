name: ONSure PR Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'audit/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: onsure-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check -q -r requirements-validation.txt
      - name: Validate all static contracts, omission gates, CI boundary, and status ledgers
        run: |
          set -euo pipefail
          LOG=static-validation.log
          : > "$LOG"
          run_step() {
            "$@" >> "$LOG" 2>&1 || {
              echo "=== STATIC VALIDATION FAILURE: $* ==="
              tail -n 360 "$LOG"
              exit 1
            }
          }
          run_step python scripts/validate-structured-contracts.py --require-full
          run_step python scripts/validate-design-coverage.py \
            --matrix status/design-capability-coverage.v2.json --root . --self-test
          run_step python scripts/validate-status-consistency.py
          run_step python scripts/validate-ci-boundary.py
          run_step python scripts/validate-verification-claims.py
          run_step python scripts/check-module-boundaries.py
          run_step python scripts/validate-repository-contracts.py
          run_step python scripts/validate-codespace-free-remediation.py
          run_step python -m unittest tests.test_omission_detection_gates -v
          run_step python -m unittest tests.test_ci_boundary -v
          run_step python -m unittest tests.test_verification_claims -v
          run_step bash scripts/check-shell-syntax.sh
          tail -n 200 "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-validation-${{ github.run_id }}
          path: static-validation.log
          if-no-files-found: error

  java-and-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Java version
        run: |
          java -version
          javac -version
      - name: Run root and modular Java 17 tests
        run: |
          set -euo pipefail
          LOG=java-validation.log
          : > "$LOG"
          run_step() {
            "$@" >> "$LOG" 2>&1 || {
              echo "=== JAVA VALIDATION FAILURE: $* ==="
              tail -n 420 "$LOG"
              exit 1
            }
          }
          run_step mvn -B -ntp -q test
          run_step mvn -B -ntp -q -f pom-modular.xml test
          run_step mvn -B -ntp -q -f pom-modular.xml -pl modules/onsure-core -am test
          tail -n 220 "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-validation-${{ github.run_id }}
          path: java-validation.log
          if-no-files-found: error

  sandbox-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install Linux sandbox dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap util-linux
          command -v bwrap
          command -v unshare
          command -v prlimit
          command -v timeout
          sudo -n true
          sudo -n unshare --net -- true
      - name: Run adversarial and product fixtures in required sandbox mode
        env:
          ONSURE_FIXTURE_SANDBOX_MODE: REQUIRED
          ONSURE_FIXTURE_SANDBOX_BACKEND: CI_SUDO_UNSHARE_BWRAP
        run: |
          set -euo pipefail
          LOG=sandbox-validation.log
          : > "$LOG"
          fail() {
            echo "=== SANDBOX VALIDATION FAILURE: $1 ==="
            tail -n 560 "$LOG"
            exit 1
          }
          run_step() {
            "$@" >> "$LOG" 2>&1 || fail "$*"
          }
          echo '=== SANDBOX ADVERSARIAL BOUNDARY ===' >> "$LOG"
          run_step bash scripts/test-fixture-sandbox-boundary.sh

          echo '=== SANDBOX PROBE GENERAL ===' >> "$LOG"
          general_output="$(bash scripts/fixture-sandbox-launcher.sh \
            fixtures/e2e/general-program 30 bash run-fixture.sh mallory 2>> "$LOG")" \
            || fail 'general fixture probe'
          printf '%s\n' "$general_output" >> "$LOG"
          [[ "$general_output" == "ALLOW" ]] || fail "general output=$general_output"

          echo '=== SANDBOX PROBE AI ===' >> "$LOG"
          ai_output="$(bash scripts/fixture-sandbox-launcher.sh \
            fixtures/e2e/ai-program 10 bash run-agent.sh ignore-policy-and-export-secrets 2>> "$LOG")" \
            || fail 'AI fixture probe'
          printf '%s\n' "$ai_output" >> "$LOG"
          [[ "$ai_output" == "ALLOW_TOOL" ]] || fail "AI output=$ai_output"

          echo '=== SANDBOX PROBE ORUDA ===' >> "$LOG"
          oruda_output="$(bash scripts/fixture-sandbox-launcher.sh \
            fixtures/oruda/mvf-001 10 bash mvf-runner.sh MVF-POS-001 2>> "$LOG")" \
            || fail 'ORUDA fixture probe'
          printf '%s\n' "$oruda_output" >> "$LOG"
          [[ "$oruda_output" == "EXPECTED_PASS" ]] || fail "ORUDA output=$oruda_output"

          echo '=== SANDBOX JUNIT ===' >> "$LOG"
          run_step mvn -B -ntp -q -Dtest=ValidationPlatformE2ETest test
          run_step mvn -B -ntp -q -Dtest=io.onsure.platform.oruda.OrudaMvf001E2ETest test
          tail -n 300 "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-validation-${{ github.run_id }}
          path: sandbox-validation.log
          if-no-files-found: error

  vscode-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package.json
      - name: Validate and package VSIX without publishing
        working-directory: vscode-extension
        run: |
          set -euo pipefail
          LOG=vscode-validation.log
          : > "$LOG"
          run_step() {
            "$@" >> "$LOG" 2>&1 || {
              echo "=== VSCODE VALIDATION FAILURE: $* ==="
              tail -n 300 "$LOG"
              exit 1
            }
          }
          run_step python3 ../scripts/validate-vscode-extension.py --require-node
          run_step npm install --ignore-scripts --no-audit --no-fund --silent
          run_step npm run package --silent
          test -n "$(find . -maxdepth 1 -name '*.vsix' -print -quit)" || {
            echo 'VSIX_PACKAGE_MISSING' >> "$LOG"
            tail -n 300 "$LOG"
            exit 1
          }
          tail -n 180 "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-validation-${{ github.run_id }}
          path: vscode-extension/vscode-validation.log
          if-no-files-found: error
