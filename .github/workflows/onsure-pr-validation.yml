name: ONSure PR Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/onsure-codespace-free-remediation-20260726
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: onsure-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java17-bounded-autofix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/onsure-codespace-free-remediation-20260726
          fetch-depth: 0
      - name: Apply and commit exact Java 17 source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'UNEXPECTED_REPLACEMENT_COUNT:{path}:{text.count(old)}')
                  p.write_text(text.replace(old, new), encoding='utf-8')
              elif new not in text:
                  raise SystemExit(f'EXPECTED_SOURCE_PATTERN_MISSING:{path}')

          replace_exact(
              'src/main/java/io/onsure/platform/Hashing.java',
              '''        Thread reader = Thread.ofVirtual().name("onsure-git-output").start(() -> {
            try { process.getInputStream().transferTo(output); }
            catch (Exception ignored) {}
        });''',
              '''        Thread reader = new Thread(() -> {
            try { process.getInputStream().transferTo(output); }
            catch (Exception ignored) {}
        }, "onsure-git-output");
        reader.setDaemon(true);
        reader.start();''')

          api = Path('src/main/java/io/onsure/platform/LocalAuthenticatedApiServer.java')
          text = api.read_text(encoding='utf-8')
          interface = '''    @FunctionalInterface
    private interface CheckedHttpHandler {
        void handle(HttpExchange exchange) throws Exception;
    }

'''
          anchor = '    private HttpServer server;\n    private ExecutorService executor;\n\n'
          if interface not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('LOCAL_API_INTERFACE_ANCHOR_INVALID')
              text = text.replace(anchor, anchor + interface)
          old_signature = '    private HttpHandler authenticated(HttpHandler handler) {'
          new_signature = '    private HttpHandler authenticated(CheckedHttpHandler handler) {'
          if old_signature in text:
              if text.count(old_signature) != 1:
                  raise SystemExit('LOCAL_API_HANDLER_SIGNATURE_COUNT_INVALID')
              text = text.replace(old_signature, new_signature)
          elif new_signature not in text:
              raise SystemExit('LOCAL_API_HANDLER_SIGNATURE_MISSING')
          api.write_text(text, encoding='utf-8')

          service = Path('src/main/java/io/onsure/platform/ServiceCaseLifecycleService.java')
          text = service.read_text(encoding='utf-8')
          digest_import = 'import java.security.MessageDigest;\n'
          import_anchor = 'import java.nio.file.StandardCopyOption;\n'
          if digest_import not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('SERVICE_CASE_IMPORT_ANCHOR_INVALID')
              text = text.replace(import_anchor, import_anchor + digest_import)
              service.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then
            echo 'NO_SOURCE_CHANGES_REQUIRED'
            exit 0
          fi
          git config user.name 'ONSure Validation Bot'
          git config user.email 'onsure-validation-bot@users.noreply.github.com'
          git add \
            src/main/java/io/onsure/platform/Hashing.java \
            src/main/java/io/onsure/platform/LocalAuthenticatedApiServer.java \
            src/main/java/io/onsure/platform/ServiceCaseLifecycleService.java
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'fix: restore Java 17 compilation boundaries'
          git push origin HEAD:feature/onsure-codespace-free-remediation-20260726

  static-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check -q -r requirements-validation.txt
      - name: Validate all static contracts, omission gates, and status ledgers
        run: |
          set -o pipefail
          {
            python scripts/validate-structured-contracts.py --require-full
            python scripts/validate-design-coverage.py \
              --matrix status/design-capability-coverage.v2.json --root . --self-test
            python scripts/validate-status-consistency.py
            python scripts/check-module-boundaries.py
            python scripts/validate-repository-contracts.py
            python scripts/validate-codespace-free-remediation.py
            python -m unittest tests.test_omission_detection_gates -v
            bash scripts/check-shell-syntax.sh
          } > static-validation.log 2>&1 || {
            echo '=== STATIC VALIDATION FAILURE ==='
            tail -n 240 static-validation.log
            exit 1
          }
          tail -n 120 static-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-validation-${{ github.run_id }}
          path: static-validation.log
          if-no-files-found: error

  java-and-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Java version
        run: |
          java -version
          javac -version
      - name: Run root and modular Java 17 tests
        run: |
          set -o pipefail
          {
            mvn -B -ntp -q test
            mvn -B -ntp -q -f pom-modular.xml test
            mvn -B -ntp -q -f pom-modular.xml -pl modules/onsure-core -am test
          } > java-validation.log 2>&1 || {
            echo '=== JAVA VALIDATION FAILURE ==='
            tail -n 260 java-validation.log
            exit 1
          }
          tail -n 120 java-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-validation-${{ github.run_id }}
          path: java-validation.log
          if-no-files-found: error

  sandbox-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install Linux sandbox dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          command -v bwrap
          command -v prlimit
          command -v timeout
      - name: Run Generic AI and ORUDA fixtures in required sandbox mode
        env:
          ONSURE_FIXTURE_SANDBOX_MODE: REQUIRED
        run: |
          set -o pipefail
          {
            mvn -B -ntp -q -Dtest=ValidationPlatformE2ETest test
            mvn -B -ntp -q -Dtest=io.onsure.platform.oruda.OrudaMvf001E2ETest test
          } > sandbox-validation.log 2>&1 || {
            echo '=== SANDBOX VALIDATION FAILURE ==='
            tail -n 260 sandbox-validation.log
            exit 1
          }
          tail -n 120 sandbox-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-validation-${{ github.run_id }}
          path: sandbox-validation.log
          if-no-files-found: error

  vscode-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package.json
      - name: Validate and package VSIX without publishing
        working-directory: vscode-extension
        run: |
          set -o pipefail
          {
            python3 ../scripts/validate-vscode-extension.py --require-node
            npm install --ignore-scripts --no-audit --no-fund --silent
            npm run package --silent
            test -n "$(find . -maxdepth 1 -name '*.vsix' -print -quit)"
          } > vscode-validation.log 2>&1 || {
            echo '=== VSCODE VALIDATION FAILURE ==='
            tail -n 200 vscode-validation.log
            exit 1
          }
          tail -n 100 vscode-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-validation-${{ github.run_id }}
          path: vscode-extension/vscode-validation.log
          if-no-files-found: error
