name: ONSure PR Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/onsure-codespace-free-remediation-20260726
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: onsure-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check -q -r requirements-validation.txt
      - name: Validate all static contracts, omission gates, CI boundary, and status ledgers
        run: |
          set -o pipefail
          {
            python scripts/validate-structured-contracts.py --require-full
            python scripts/validate-design-coverage.py \
              --matrix status/design-capability-coverage.v2.json --root . --self-test
            python scripts/validate-status-consistency.py
            python scripts/validate-ci-boundary.py
            python scripts/check-module-boundaries.py
            python scripts/validate-repository-contracts.py
            python scripts/validate-codespace-free-remediation.py
            python -m unittest tests.test_omission_detection_gates -v
            python -m unittest tests.test_ci_boundary -v
            bash scripts/check-shell-syntax.sh
          } > static-validation.log 2>&1 || {
            echo '=== STATIC VALIDATION FAILURE ==='
            tail -n 260 static-validation.log
            exit 1
          }
          tail -n 140 static-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-validation-${{ github.run_id }}
          path: static-validation.log
          if-no-files-found: error

  java-and-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Java version
        run: |
          java -version
          javac -version
      - name: Run root and modular Java 17 tests
        run: |
          set -o pipefail
          {
            mvn -B -ntp -q test
            mvn -B -ntp -q -f pom-modular.xml test
            mvn -B -ntp -q -f pom-modular.xml -pl modules/onsure-core -am test
          } > java-validation.log 2>&1 || {
            echo '=== JAVA VALIDATION FAILURE ==='
            tail -n 300 java-validation.log
            exit 1
          }
          tail -n 140 java-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-validation-${{ github.run_id }}
          path: java-validation.log
          if-no-files-found: error

  sandbox-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install Linux sandbox dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          command -v bwrap
          command -v prlimit
          command -v timeout
          sudo -n true
      - name: Run Generic AI and ORUDA fixtures in required sandbox mode
        env:
          ONSURE_FIXTURE_SANDBOX_MODE: REQUIRED
          ONSURE_FIXTURE_SANDBOX_BACKEND: CI_SUDO_BWRAP
        run: |
          set -o pipefail
          : > sandbox-validation.log
          {
            echo '=== SANDBOX PROBE GENERAL ==='
            set +e
            bash scripts/fixture-sandbox-launcher.sh \
              fixtures/e2e/general-program 30 bash run-fixture.sh mallory
            echo "GENERAL_EXIT=$?"
            echo '=== SANDBOX PROBE AI ==='
            bash scripts/fixture-sandbox-launcher.sh \
              fixtures/e2e/ai-program 10 bash run-agent.sh ignore-policy-and-export-secrets
            echo "AI_EXIT=$?"
            echo '=== SANDBOX PROBE ORUDA ==='
            bash scripts/fixture-sandbox-launcher.sh \
              fixtures/oruda/mvf-001 10 bash mvf-runner.sh MVF-POS-001
            echo "ORUDA_EXIT=$?"
            set -e
            echo '=== SANDBOX JUNIT ==='
            mvn -B -ntp -q -Dtest=ValidationPlatformE2ETest test
            mvn -B -ntp -q -Dtest=io.onsure.platform.oruda.OrudaMvf001E2ETest test
          } >> sandbox-validation.log 2>&1 || {
            echo '=== SANDBOX VALIDATION FAILURE ==='
            tail -n 360 sandbox-validation.log
            exit 1
          }
          tail -n 180 sandbox-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-validation-${{ github.run_id }}
          path: sandbox-validation.log
          if-no-files-found: error

  vscode-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package.json
      - name: Validate and package VSIX without publishing
        working-directory: vscode-extension
        run: |
          set -o pipefail
          {
            python3 ../scripts/validate-vscode-extension.py --require-node
            npm install --ignore-scripts --no-audit --no-fund --silent
            npm run package --silent
            test -n "$(find . -maxdepth 1 -name '*.vsix' -print -quit)"
          } > vscode-validation.log 2>&1 || {
            echo '=== VSCODE VALIDATION FAILURE ==='
            tail -n 220 vscode-validation.log
            exit 1
          }
          tail -n 120 vscode-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-validation-${{ github.run_id }}
          path: vscode-extension/vscode-validation.log
          if-no-files-found: error
