name: ONSure DD Runtime Qualification

on:
  push:
    branches:
      - autopilot/design-closure-mission
      - github/**
  pull_request:
    paths:
      - 'contracts/dd-*.json'
      - 'contracts/workflow-operation-registry.v1.json'
      - 'src/main/java/kr/co/oruda/onsure/platform/**'
      - 'modules/onsure-core/src/test/java/kr/co/oruda/onsure/platform/**'
      - 'scripts/validate-dd-granular-vertical-trace.py'
      - 'pom-modular.xml'
      - 'modules/onsure-core/pom.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dd-runtime-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate DD machine definitions
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open('contracts/dd-machine-operation-schema-fixture-registry.candidate.v1.json'))
          w=json.load(open('contracts/workflow-operation-registry.v1.json'))
          rows=m['rows']; ops=set(w['operations'])
          assert len(rows)==40
          assert len({r['dd'] for r in rows})==40
          assert len({r['operation'] for r in rows})==40
          assert all(r['operation'] in ops for r in rows)
          assert all(r['request_schema'] and r['result_schema'] and r['fixture'] for r in rows)
          print({'dd_count':len(rows),'workflow_operation_count':len(ops),'machine_definition_gap_instances':0})
          PY
      - name: Compile and run ONSure core tests
        run: mvn -B -f pom-modular.xml -pl modules/onsure-core -am test
      - name: Preserve runtime qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onsure-dd-runtime-qualification-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            modules/onsure-core/target/surefire-reports/**
            modules/onsure-assurance/target/surefire-reports/**
            modules/onsure-contracts/target/surefire-reports/**
          retention-days: 30
